<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Making your first Phaser 3 Game - Part 1</title>
    <script src="//cdn.jsdelivr.net/npm/phaser@3.11.0/dist/phaser.js"></script>
    <style type="text/css">
      body {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <script type="text/javascript">
      var config = {
        type: Phaser.AUTO,
        width: 800,
        height: 600,
        physics: {
          default: "arcade",
          arcade: {
            gravity: { y: 100 },
            debug: true,
          },
        },
        scene: {
          preload: preload,
          create: create,
          update: update,
        },
      };

      var game = new Phaser.Game(config);
      var platforms;

      function preload() {
        this.load.image("sky", "assets/sky.png");
        this.load.image("star", "assets/star.png");
        this.load.image('ground', 'assets/platform.png');

        this.load.spritesheet('dude', 'assets/dude.png', { frameWidth: 32, frameHeight: 48 });


      }

      function create() {
        this.add.image(400, 300, "sky");
        this.add.image(400, 400, "star");

        platforms = this.physics.add.staticGroup();

        platforms.create(400, 568, "ground").setScale(2).refreshBody();

        platforms.create(600, 400, "ground").setScale(2);
        platforms.create(50, 250, "ground");
        platforms.create(750, 220, "ground");

        this.add.image(400, 100, "star");
        this.physics.add.image(450, 100, "star");

        player = this.physics.add.sprite(300, 200, 'dude').setScale(0.5)
        //player = this.add.sprite(300, 200, 'dude');

        player.setBounce(0.3);
        player.setCollideWorldBounds(true);
        
      }

      function update() {}
    </script>
  </body>
</html>
